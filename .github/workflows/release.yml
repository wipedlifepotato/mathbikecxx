name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev build-essential
      - name: Build Trie
        run: make Trie
      - name: Prepare artifact
        run: |
          mkdir -p dist
          mv Trie dist/trigande-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist/

  build-openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: |
            pkg_add gmp
            gmake Trie
      - name: Prepare artifact
        run: |
          mkdir -p dist
          mv Trie dist/trigande-openbsd-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: bin-openbsd
          path: dist/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-toolchain mingw-w64-x86_64-gmp make
      - name: Build Trie
        run: make Trie
      - name: Prepare artifact
        run: |
          mkdir -p dist
          mv Trie.exe dist/trigande-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/

  release:
    needs: [build-linux, build-openbsd, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/bin-linux/*
            artifacts/bin-openbsd/*
            artifacts/bin-windows/*
