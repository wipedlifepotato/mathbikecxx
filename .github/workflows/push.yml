name: CI Build Check

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev build-essential
      - name: Build Trie
        run: make Trie

  build-openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: |
            pkg_add gmp gmake
            gmake Trie

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-toolchain mingw-w64-x86_64-gmp make
      - name: Build Trie
        run: |
          make Trie CXXFLAGS="-std=c++17 -pthread -Wall -Wextra -DWIN32"
