name: CI Build Check

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev build-essential
      - name: Build Trie
        run: make Trie
      - name: Smoke test
        run: ./Trie --help

  build-openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            export PKG_PATH="https://cdn.openbsd.org/pub/OpenBSD/$(uname -r)/packages/$(uname -m)/"
            pkg_add -I gmp gmpxx gmake
          run: |
            /bin/ksh make_openbsd.sh
            ./Trie --help

  build-windows:
    name: Windows static (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            arch: x86_64
            makefile: Makefile.mingw64
          - msystem: MINGW32
            prefix: mingw-w64-i686
            arch: i686
            makefile: Makefile.mingw32
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            make
            zip
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-gmp
      - name: Build static Trie.exe
        run: |
          set -euo pipefail
          make -f ${{ matrix.makefile }} prepareSAM
          make -f ${{ matrix.makefile }}
          IMPORTS="$(objdump -p Trie.exe | sed -n 's/.*DLL Name: //p' | tr '[:upper:]' '[:lower:]')"
          echo "$IMPORTS"
          if echo "$IMPORTS" | grep -Eq 'lib(gmp|stdc|gcc|winpthread)'; then
            echo "::error::Trie.exe is not fully static"
            exit 1
          fi
      - name: Smoke test
        run: ./Trie.exe --help

  build-macos:
    name: macOS (not fully isolated)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install gmp
      - name: Build Trie
        run: |
          GMP="$(brew --prefix gmp)"
          make prepareSAM
          make Trie \
            CXXFLAGS="-std=c++17 -pthread -Wall -Wextra -I$GMP/include" \
            LIBS="-L$GMP/lib -lgmp -lgmpxx"
      - name: Smoke test
        run: ./Trie --help
